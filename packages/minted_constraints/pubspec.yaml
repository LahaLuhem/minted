name: minted_constraints
description: >-
  Well-modelled Dart constraint types: primitives carrying a constraint, with no standard defining
  their text form. Part of the minted family.
version: 1.0.0
homepage: https://github.com/LahaLuhem/minted?tab=readme-ov-file
repository: https://github.com/LahaLuhem/minted

topics:
  - validation
  - type-safety
  - text
  - domain-driven-design

environment:
  sdk: ^3.13.0

# Resolved as part of the workspace rooted two levels up.
resolution: workspace

dependencies:
  characters: ^1.4.1

dev_dependencies:
  checks: ^0.3.1
  test: ^1.31.2

# Tags carry the package prefix, so the emitted CHANGELOG links do too.
cider:
  link_template:
    tag: https://github.com/LahaLuhem/minted/releases/tag/minted_constraints-%tag%
    diff: "https://github.com/LahaLuhem/minted/compare/\
      minted_constraints-%from%...minted_constraints-%to%"

name: minted_geography
description: >-
  Well-modelled Dart value types for geography: GeoCoordinate (ISO 6709 in all three field widths)
  and Geohash (base32 cells that decode). Part of the minted family.
version: 1.1.0
homepage: https://github.com/LahaLuhem/minted?tab=readme-ov-file
repository: https://github.com/LahaLuhem/minted

topics:
  - validation
  - type-safety
  - geography
  - domain-driven-design
  - standards

environment:
  sdk: ^3.13.0

# Resolved as part of the workspace rooted two levels up.
resolution: workspace

dependencies:
  meta: ^1.19.0
  minted: ^3.0.0

dev_dependencies:
  checks: ^0.3.1
  test: ^1.31.2

# Tags carry the package prefix, so the emitted CHANGELOG links do too.
cider:
  link_template:
    tag: https://github.com/LahaLuhem/minted/releases/tag/minted_geography-%tag%
    diff: "https://github.com/LahaLuhem/minted/compare/\
      minted_geography-%from%...minted_geography-%to%"

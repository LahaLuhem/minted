name: minted_geography
description: >-
  Well-modelled Dart value types for geography: GeoCoordinate (ISO 6709, all 3 field widths),
  GeoBounds, and the Geohash and Plus Code cells that decode. Part of the minted family.
version: 1.2.0
homepage: https://github.com/LahaLuhem/minted/tree/main/packages/minted_geography?tab=readme-ov-file
repository: https://github.com/LahaLuhem/minted/tree/main/packages/minted_geography

topics:
  - validation
  - type-safety
  - geography
  - domain-driven-design
  - standards

environment:
  sdk: ^3.13.0

# Resolved as part of the workspace rooted two levels up.
resolution: workspace

dependencies:
  meta: ^1.19.0
  minted: ^3.1.1
  minted_constraints: ^1.2.0
  open_location_code: ^1.0.1

dev_dependencies:
  checks: ^0.3.2
  test: ^1.32.0

# Tags carry the package prefix, so the emitted CHANGELOG links do too.
cider:
  link_template:
    tag: https://github.com/LahaLuhem/minted/releases/tag/minted_geography-%tag%
    diff: "https://github.com/LahaLuhem/minted/compare/\
      minted_geography-%from%...minted_geography-%to%"

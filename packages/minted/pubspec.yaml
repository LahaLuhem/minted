name: minted
description: >-
  Well-modelled Dart value types (email, IBAN, and more) built on
  parse-don't-validate, so every instance is guaranteed well-formed. Pure Dart.
version: 3.0.0
homepage: https://github.com/LahaLuhem/minted?tab=readme-ov-file
repository: https://github.com/LahaLuhem/minted




topics:
  - validation
  - type-safety
  - identifiers
  - domain-driven-design
  - standards




environment:
  sdk: ^3.13.0

# Resolved as part of the workspace rooted two levels up: deps come from the root lockfile, and a
# sibling dependency would resolve to the local copy rather than the published one.
resolution: workspace




# Every engine left with the types that wrapped it: email_validator and phone_numbers_parser to
# minted_contact, iban_validator and country_code to minted_finance, ipaddr to minted_network.
# What remains is the point of the split, a core that costs a consumer nothing they don't use.
dependencies:
  collection: ^1.19.1
  meta: ^1.19.0




dev_dependencies:
  checks: ^0.3.1
  test: ^1.31.2




# Tags carry the package prefix since the workspace split, so the emitted CHANGELOG links do too.
# The first prefixed release has a dangling `from`: 2.0.0 and earlier were tagged bare, and those
# historical tags are not renamed.
cider:
  link_template:
    tag: https://github.com/LahaLuhem/minted/releases/tag/minted-%tag%
    diff: https://github.com/LahaLuhem/minted/compare/minted-%from%...minted-%to%

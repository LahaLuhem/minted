name: minted
description: >-
  Well-modelled Dart value types (email, IBAN, and more) built on
  parse-don't-validate, so every instance is guaranteed well-formed. Pure Dart.
version: 2.0.0
homepage: https://github.com/LahaLuhem/minted?tab=readme-ov-file
repository: https://github.com/LahaLuhem/minted




topics:
  - validation
  - type-safety
  - identifiers
  - domain-driven-design
  - standards




environment:
  sdk: ^3.13.0

# Resolved as part of the workspace rooted two levels up: deps come from the root lockfile, and a
# sibling dependency would resolve to the local copy rather than the published one.
resolution: workspace




dependencies:
  collection: ^1.19.1
  country_code: ^1.1.0
  email_validator: ^3.0.0
  iban_validator: ^1.0.2
  ipaddr: ^2.1.1
  meta: ^1.19.0
  phone_numbers_parser: ^9.0.25




dev_dependencies:
  analyzer: ^14.1.0
  checks: ^0.3.1
  test: ^1.31.2




cider:
  link_template:
    tag: https://github.com/LahaLuhem/minted/releases/tag/%tag%
    diff: https://github.com/LahaLuhem/minted/compare/%from%...%to%

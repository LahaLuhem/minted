name: minted_contact
description: >-
  Well-modelled Dart value types for contact details: Email and PhoneNumber, checked against the
  real standards rather than a regex. Part of the minted family.
version: 1.0.1
homepage: https://github.com/LahaLuhem/minted?tab=readme-ov-file
repository: https://github.com/LahaLuhem/minted

topics:
  - validation
  - type-safety
  - email
  - domain-driven-design
  - standards

environment:
  sdk: ^3.13.0

# Resolved as part of the workspace rooted two levels up.
resolution: workspace

dependencies:
  collection: ^1.19.1
  email_validator: ^3.0.0
  minted: ^3.0.0
  minted_network: ^1.0.0
  phone_numbers_parser: ^9.0.25

dev_dependencies:
  checks: ^0.3.1
  test: ^1.31.2

# Tags carry the package prefix, so the emitted CHANGELOG links do too.
cider:
  link_template:
    tag: https://github.com/LahaLuhem/minted/releases/tag/minted_contact-%tag%
    diff: "https://github.com/LahaLuhem/minted/compare/\
      minted_contact-%from%...minted_contact-%to%"

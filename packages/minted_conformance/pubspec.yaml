# Never published: it holds the suites that sweep across packages, which belong to no single one.
# `publish_to: none` is also what keeps it out of the dartdoc, deps and publish jobs.
name: minted_conformance
description: >-
  Cross-package conformance and failure-contract suites for the minted family. Private to the
  workspace; nothing here ships.
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

# Depends on every published member, because the suites here sweep across all of them.
dependencies:
  minted: ^3.1.0
  minted_chronology: ^1.0.2
  minted_contact: ^1.0.2
  minted_finance: ^1.0.2
  minted_geography: ^1.1.0
  minted_identifiers: ^1.0.1
  minted_network: ^1.1.0

dev_dependencies:
  analyzer: ^14.1.0
  checks: ^0.3.1
  test: ^1.31.2

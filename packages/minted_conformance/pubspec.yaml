# Never published: it holds the suites that sweep across packages, which belong to no single one.
# `publish_to: none` is also what keeps it out of the dartdoc and publish jobs.
name: minted_conformance
description: >-
  Cross-package conformance and failure-contract suites for the minted family. Private to the
  workspace; nothing here ships.
publish_to: none

environment:
  sdk: ^3.13.0

resolution: workspace

# All dev: there is no lib/, so every sibling is used only by the suites that sweep across them.
dev_dependencies:
  analyzer: ^14.4.0
  checks: ^0.3.2
  minted: ^3.1.1
  minted_chronology: ^1.1.0
  minted_contact: ^1.1.0
  minted_finance: ^1.1.0
  minted_geography: ^1.1.1
  minted_identifiers: ^1.1.0
  minted_network: ^1.1.0
  test: ^1.32.0

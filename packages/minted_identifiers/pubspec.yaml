name: minted_identifiers
description: >-
  Well-modelled Dart value types for standard identifiers: UUID, ISBN, ISSN, ISNI, IMEI and GTIN,
  check digits included. Part of the minted family.
version: 1.1.0
homepage: https://github.com/LahaLuhem/minted?tab=readme-ov-file
repository: https://github.com/LahaLuhem/minted

topics:
  - validation
  - type-safety
  - identifiers
  - domain-driven-design
  - standards

environment:
  sdk: ^3.13.0

# Resolved as part of the workspace rooted two levels up.
resolution: workspace

dependencies:
  collection: ^1.19.1
  meta: ^1.19.0
  minted: ^3.1.0
  minted_constraints: ^1.1.0

dev_dependencies:
  checks: ^0.3.1
  test: ^1.31.2

# Tags carry the package prefix, so the emitted CHANGELOG links do too.
cider:
  link_template:
    tag: https://github.com/LahaLuhem/minted/releases/tag/minted_identifiers-%tag%
    diff: "https://github.com/LahaLuhem/minted/compare/\
      minted_identifiers-%from%...minted_identifiers-%to%"

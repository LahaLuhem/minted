# Dependabot version updates.
# Reference (options):
# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Bot PRs branch as `dependabot/...` and carry no `sem-*` label. The
# PR-convention and changelog workflows exempt `dependabot[bot]` from the
# branch-name, sem-label and changelog jobs (see
# .github/workflows/{pr-conventions,changelog}.yml), so these PRs land WITHOUT
# an automatic CHANGELOG entry — add one by hand if a bump is user-visible.
# The commit-length / no-merge-commit gate still applies to them.
#
# Minor + patch bumps are grouped into one PR per ecosystem to cut noise; major
# bumps still arrive as individual PRs so they can be reviewed in isolation.
#
# No `/example` entry: the examples are single-file demos with no pubspec of
# their own, so there is nothing separate for Dependabot to resolve there.
version: 2

updates:
  # --- Dart: the workspace ---
  # `/` is the root (melos and any other shared dev dependency); `/packages/*`
  # is every member, where the published constraints live. pub.dev packages
  # only — git / path deps are not eligible.
  - package-ecosystem: "pub"
    directories:
      - "/"
      - "/packages/*"
    schedule:
      interval: "weekly"
    groups:
      pub:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- GitHub Actions ---
  # `directory: "/"` scans everything under .github/ — the workflows and the
  # local composite actions under .github/actions/.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

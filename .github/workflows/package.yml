name: Package checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # Pull-request runs cancel each other per PR; main-branch runs cancel only
  # against later main commits. The `|| github.ref` fallback keeps the group
  # well-formed on push events where `pull_request.number` is empty.
  group: pkg-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The per-package jobs fan out over these, so adding a package needs no edit here. `publishable`
  # drops `publish_to: none` members, which have no pub.dev surface to document or release. `all`
  # keeps them, because a private package's dependencies are still worth checking.
  members:
    name: List workspace members
    runs-on: ubuntu-latest
    outputs:
      publishable: ${{ steps.list.outputs.publishable }}
      all: ${{ steps.list.outputs.all }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        run: |
          all="$(for dir in packages/*/; do
            printf '%s\n' "${dir%/}"
          done | jq -Rsc 'split("\n") | map(select(length > 0))')"
          publishable="$(for dir in packages/*/; do
            grep -qE '^publish_to: *none' "${dir}pubspec.yaml" && continue
            printf '%s\n' "${dir%/}"
          done | jq -Rsc 'split("\n") | map(select(length > 0))')"
          if [ "$publishable" = '[]' ]; then
            echo '::error::No publishable package found under packages/.'
            exit 1
          fi
          echo "all=$all" >> "$GITHUB_OUTPUT"
          echo "publishable=$publishable" >> "$GITHUB_OUTPUT"

  analyze:
    name: Dart analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dart
      # Not per-package: one root pass covers every member's lib, test and example.
      - run: dart --no-version-check analyze .

  dartdoc:
    name: Dartdoc (${{ matrix.package }})
    needs: members
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.members.outputs.publishable) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dart
      # `dart doc` exits 0 even when it warns, so the summary line is the gate.
      - name: Generate docs, failing on any warning
        working-directory: ${{ matrix.package }}
        run: |
          set -o pipefail
          dart doc --dry-run 2>&1 | tee dartdoc.log
          grep -qE 'Found 0 warnings and 0 errors' dartdoc.log

  deps:
    name: Dependency validator (${{ matrix.package }})
    needs: members
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.members.outputs.all) }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dart
      - run: dart pub get
      # Per-package: it reads one pubspec and the imports resolved against it.
      - run: dart run dependency_validator -C ${{ matrix.package }}

  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-dart
      - run: dart pub global activate coverage
      # One job, not a matrix: the gate below wants a single figure across the workspace, and the
      # melos script already fans the tests out and formats the result once, over every package's
      # lib. Formatting per package would discard what each test covers elsewhere.
      #
      # `--check-ignore` (inside the melos script) makes `format_coverage` honour the
      # `// coverage:ignore-line`, `ignore-start`/`ignore-end`, and `ignore-file` pragmas in
      # source files. Without it, the directives are silently inert.
      #
      # `ignore-line` applies to the line the comment sits ON, so it only works as a trailing
      # comment. To exempt a line too long to carry one, wrap it in `ignore-start`/`ignore-end`;
      # a preceding `ignore-line` looks right and does nothing.

      # The root's own suite, which the coverage script cannot reach: `melos exec` visits
      # members and the root is not one. No coverage flag, so the gate stays library-only.
      # Excluded here because the release-flow test gets its own step below.
      - name: Test the release tooling
        run: dart test -x integration
      # The flow invokes bare `cider`, so the global binary has to be on PATH.
      - name: Activate cider
        run: |
          dart pub global activate cider
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Test the release flow end to end
        run: dart test -t integration

      - name: Test every member with coverage
        run: dart run melos run coverage
      # Upload BEFORE the gate so the coverage badge updates and PR comments
      # land even when the gate would fail. Coveralls auto-routes based on
      # event context (PR vs. push to main).
      #
      # `continue-on-error: true` keeps a Coveralls outage from failing the
      # whole job — Coveralls is observability, not a correctness gate; the
      # actual threshold check is the next step. The step still shows RED in
      # the CI UI on failure so broken uploads don't go unnoticed for long.
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage/lcov.info
          format: lcov
      - name: Enforce min coverage (95%)
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: coverage/lcov.info
          min_coverage: 95

# ryl (YAML lint) config for minted, yamllint-compatible. ryl finds it on its own, in CI's lint job
# and in the release preflight alike.
#
# Starts from yamllint's "default" rule set, then tuned to the repo's deliberate
# YAML style rather than the other way round: the wide section dividers in
# pubspec.yaml are intentional, and GitHub workflows use the `on:` key with no leading `---`.
extends: default

rules:
  # 100 columns, matching .editorconfig. Long single-token URLs in comments stay
  # exempt via yamllint's allow-non-breakable-words default.
  line-length:
    max: 100
  # Allow the intentional multi-blank section dividers.
  empty-lines:
    max: 5
  # Workflows use `on:`, which reads as a truthy key, so keep value checks, not keys.
  truthy:
    check-keys: false
  # Single-document files here don't lead with `---`.
  document-start: disable

# Workspace root: one `dart pub get` resolves every member against one lockfile. Never published.
# Members are listed rather than globbed, so adding a package shows up in a diff.
name: minted_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/minted
  - packages/minted_chronology
  - packages/minted_conformance
  - packages/minted_contact
  - packages/minted_finance
  - packages/minted_geography
  - packages/minted_identifiers
  - packages/minted_network

dev_dependencies:
  args: ^2.7.0
  checks: ^0.3.1
  collection: ^1.19.1
  melos: ^8.3.0
  terminice: ^1.3.0
  test: ^1.31.2

# Script runner only. cider and tool/release.dart own versioning and publishing, so `melos version`
# and `melos publish` stay unused; workspaces do the linking, so `melos bootstrap` does too.
melos:
  scripts:
    analyze:
      description: Every member in one pass, from the root.
      run: dart --no-version-check analyze .

    format:
      description: Repo-wide format check, the gate CI applies.
      run: dart format --output=none --set-exit-if-changed .

    test:
      description: Each member's suite, plus the root's own tooling suite.
      # `exec` visits members only, and the root is not one of them, so the root's tests need the
      # second line. Same shape as `coverage` below.
      run: |
        dart run melos exec --fail-fast --dir-exists=test -- dart test
        dart test

    coverage:
      description: >-
        Tests every member, then one workspace-wide lcov. Needs `dart pub global activate
        coverage` once.
      # Collected per package but formatted once, across every package's lib. Formatting per
      # package instead would report each one only on its own lib and discard the rest, which
      # silently drops what a test covers in another package: the failure-contract suite lives in
      # minted_conformance and exercises every sibling's failures/, and minted_conformance has no
      # lib at all. That scoping cost 18 points of coverage when the split landed.
      run: |
        dart run melos exec --fail-fast --dir-exists=test -- dart test --coverage=coverage
        mkdir -p coverage
        dart pub global run coverage:format_coverage --lcov --check-ignore \
          --in=packages --report-on="$(ls -d packages/*/lib | paste -sd, -)" \
          --packages=.dart_tool/package_config.json \
          -o coverage/lcov.info

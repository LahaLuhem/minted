# Workspace root: one `dart pub get` resolves every member against one lockfile. Never published.
# Members are listed rather than globbed, so adding a package shows up in a diff.
name: minted_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/minted
  - packages/minted_chronology
  - packages/minted_conformance
  - packages/minted_constraints
  - packages/minted_contact
  - packages/minted_finance
  - packages/minted_geography
  - packages/minted_identifiers
  - packages/minted_network

dev_dependencies:
  dependency_validator: ^5.1.0
  melos: ^8.8.0
  # test/support/digits.dart builds Digits fixtures for the sibling suites.
  minted_constraints: ^1.2.0
  test: ^1.32.0

# Script runner only. The release run owns versioning and publishing, so `melos version` and
# `melos publish` stay unused. Workspaces do the linking, so `melos bootstrap` does too.
melos:
  scripts:
    analyze:
      description: Every member in one pass, from the root, the gate CI applies.
      run: dart --no-version-check analyze --fatal-infos .

    format:
      description: Repo-wide format check, the gate CI applies.
      run: dart format --output=none --set-exit-if-changed .

    dcm:
      description: >-
        The rules `dart analyze` cannot run, from the `dart_code_metrics:` block in
        analysis_options.yaml. Needs the DCM CLI: https://dcm.dev/docs/getting-started/.
      # Exits 2 on a warning by default, so no --fatal-* flag is needed to make it a gate.
      run: dcm analyze .

    test:
      description: Each member's suite.
      run: dart run melos exec --fail-fast --group-logs --dir-exists=test -- dart test

    coverage:
      description: >-
        Tests every member, then one workspace-wide lcov. Needs `dart pub global activate
        coverage` once.
      # Collected per package but formatted once, across every package's lib. Formatting per
      # package instead would report each one only on its own lib and discard the rest, which
      # silently drops what a test covers in another package: the failure-contract suite lives in
      # minted_conformance and exercises every sibling's failures/, and minted_conformance has no
      # lib at all. That scoping cost 18 points of coverage when the split landed.
      run: |
        dart run melos exec --fail-fast --group-logs --dir-exists=test -- \
          dart test --coverage=coverage
        mkdir -p coverage
        dart pub global run coverage:format_coverage --lcov --check-ignore \
          --in=packages --report-on="$(ls -d packages/*/lib | paste -sd, -)" \
          --packages=.dart_tool/package_config.json \
          -o coverage/lcov.info

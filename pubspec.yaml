# Workspace root: one `dart pub get` resolves every member against one lockfile. Never published.
# Members are listed rather than globbed, so adding a package shows up in a diff.
name: minted_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/minted

dev_dependencies:
  melos: ^8.3.0

# Script runner only. cider and scripts/release.sh own versioning and publishing, so `melos version`
# and `melos publish` stay unused; workspaces do the linking, so `melos bootstrap` does too.
melos:
  scripts:
    analyze:
      description: Every member in one pass, from the root.
      run: dart --no-version-check analyze .

    format:
      description: Repo-wide format check, the gate CI applies.
      run: dart format --output=none --set-exit-if-changed .

    test:
      description: Each member's suite; the root has none of its own.
      exec: dart test
      packageFilters:
        dirExists: test

    coverage:
      description: Tests + an lcov per member. Needs `dart pub global activate coverage` once.
      exec:
        command: >-
          dart test --coverage=coverage &&
          dart pub global run coverage:format_coverage --lcov --check-ignore
          --in=coverage --report-on=lib
          --packages="$MELOS_ROOT_PATH/.dart_tool/package_config.json"
          -o coverage/lcov.info
        concurrency: 1
      packageFilters:
        dirExists: test
